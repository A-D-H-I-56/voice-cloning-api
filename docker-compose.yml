services:
  # ---------------------------------------------------------------------------
  # FastAPI application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_cloning_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - API_KEY=${API_KEY}
      - DEBUG=${DEBUG:-false}
      - COQUI_TOS_AGREED=1
    volumes:
      # Persist embeddings and generated audio on the host
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      # Coqui TTS model cache (prevents re-downloads)
      - tts_model_cache:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # ----- GPU support (optional) -----
    # Uncomment if you have NVIDIA GPU + Docker configured
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  tts_model_cache:
    driver: local
